version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: homechef
      POSTGRES_PASSWORD: homechef_dev
      POSTGRES_DB: homechef
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U homechef"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    command: redis-server --appendonly yes --maxmemory-policy noeviction
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: development
      PORT: 3000
      DATABASE_URL: postgres://homechef:homechef_dev@postgres:5432/homechef
      REDIS_URL: redis://redis:6379
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY}"
      JWT_SECRET: "${JWT_SECRET:-dev-secret-change-in-prod}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend/src:/app/src
      - /app/node_modules

volumes:
  pgdata:
  redisdata: